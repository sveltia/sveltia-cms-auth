# Allow deploying the project to Cloudflare Workers
# https://developers.cloudflare.com/workers/tutorials/deploy-button/

name: Build
on:
  repository_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v7.0.1
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: latest
          runtime: node@26
          cache: true
      - name: Build & Deploy Worker
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
